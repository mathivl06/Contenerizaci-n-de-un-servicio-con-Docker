services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PG_DATA: ${PG_DATA}
    networks:
      - restaurant-network
    volumes:
      - type: volume
        source: restaurant-db-volume
        target: ${PG_VOLUME}
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped
  flyway:
    image: flyway/flyway
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      FLYWAY_URL: jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    command: migrate
    volumes:
      - type: bind
        source: ./DataBaseScript
        target: /flyway/sql
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "flyway", "info"]
      interval: 1m30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 5s
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  app:
    image: patos-rest-api:1
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${POSTGRES_DB}
      APP_DB_PORT: ${POSTGRES_PORT}
      APP_PORT: ${APP_PORT}
      APP_DB_HOST: ${APP_DB_HOST}
    depends_on:
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT}/paTOSrest/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - restaurant-network
  test-runner:
    image: patos-rest-api:1-test-runner
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_URL: http://app:${APP_PORT}
      KEYCLOAK_URL: http://${KEYCLOAK_HOSTNAME}:${KEYCLOAK_PORT}
    depends_on: 
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - restaurant-network
    profiles:
      - test  
volumes:
  restaurant-db-volume:
    name: restaurant-db-volume
networks:
  restaurant-network:
    name: restaurant-network