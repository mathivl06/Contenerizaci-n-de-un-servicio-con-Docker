apiVersion: batch/v1
kind: Job
metadata:
  name: flyway
  labels:
    app.kubernetes.io/name: flyway
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyway
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: patos-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: patos-config
                  key: POSTGRES_DB
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: patos-config
                  key: POSTGRES_PORT
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Esperando PostgreSQL..."
                sleep 3
              done
      containers:
        - name: flyway
          image: flyway/flyway
          args:
            - migrate
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://postgres:5432/restauranteDB
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: patos-secret
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patos-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: flyway-sql
          configMap:
            name: flyway-sql
